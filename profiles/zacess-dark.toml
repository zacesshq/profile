# the Zacess Dark theme as a profile, one of the eight starter profiles
# colours from the Zacess themes palette 0.12.0

spec_version = 1
name = "Zacess Dark"
id = "zacess-dark"
description = "Near white on near black, the reader's Light on dark theme."
appearance = "dark"

[needs]
reduce_motion = true
cursor_size = "standard"
focus_ring_width_px = 2

[needs.contrast]
text = 7.0
non_text = 3.0
overlay = 4.5
terminal = 7.0
terminal_dim = 4.5
highlight_distance = 0.08

[needs.font]
family = "Atkinson Hyperlegible Mono"
fallback = "monospace"
size_pt = 14

[palette]
background = "#121212"
foreground = "#f5f5f5"
surface = "#1a1a1a"
muted = "#c8c8c8"
border = "#7a7a7a"
accent = "#8cbcff"
accent_foreground = "#121212"
link = "#8cbcff"
focus_ring = "#8cbcff"
cursor = "#ffd400"
cursor_text = "#121212"
selection_background = "#4fbdff"
selection_foreground = "#121212"
selection_soft = "#004769"
line_highlight = "#2f2f2f"
error = "#ffccc4"
warning = "#ffd182"
info = "#bddaff"

[palette.syntax]
keyword = "#d3bdff"
control = "#ffd2e6"
function = "#84b7fa"
type = "#03dedd"
variable = "#f5f5f5"
parameter = "#ffb97f"
property = "#c5e1ff"
string = "#1ee646"
number = "#ffd9ba"
comment = "#80c201"
operator = "#f5f5f5"
tag = "#d3bdff"
attribute = "#ffdb9e"
regex = "#f3989e"
invalid = "#ffd7d2"
added = "#01ea45"
removed = "#f39992"
changed = "#c9e0ff"

[palette.terminal]
ansi = [
    "#a3a3a3", "#ffa79b", "#1bdb41", "#f0b40b",
    "#90c1ff", "#f7a0f1", "#37d2cf", "#e6e6e6",
    "#c8c8c8", "#ffd5ce", "#34ff57", "#ffda8a",
    "#c9e0ff", "#ffd0fa", "#23f6f8", "#ffffff",
]
