# for kitty, from the profile Every need
# written by zprf; change the profile and render again rather than editing this file
# load it from kitty.conf with: include <path to this file>

foreground #ffffff
background #101418
selection_foreground #101418
selection_background #b68cfa
cursor #dab600
cursor_text_color #101418
url_color #66a9ff
active_border_color #66a9ff
inactive_border_color #696969
active_tab_foreground #101418
active_tab_background #66a9ff
inactive_tab_foreground #a7a7a7
inactive_tab_background #171b1f
tab_bar_background #171b1f

color0 #101418
color1 #ff7867
color2 #55b64c
color3 #b6a200
color4 #6da0ff
color5 #e07ddd
color6 #00b4b4
color7 #b8b8b8
color8 #a1a1a1
color9 #ff9e8f
color10 #6ccd63
color11 #cfb800
color12 #91b8ff
color13 #f894f5
color14 #00cccc
color15 #ffffff

cursor_shape block
# shell integration turns the cursor into a beam at every prompt unless told not to
shell_integration no-cursor
# a program can still ask for a beam, so it is widened too; kitty measures it in points
cursor_beam_thickness 4.5
cursor_blink_interval 0
cursor_trail 0
visual_bell_duration 0
font_family Atkinson Hyperlegible Mono
font_size 16.0
modify_font cell_height 150%
# the active window's border is kitty's focus ring
window_border_width 4px
# windows stack top to bottom or one fills the tab, so nothing sits side by side
enabled_layouts vertical,stack
# a solid background, so text is never drawn over an image or whatever sits behind the window
background_opacity 1.0
background_blur 0
background_image none
