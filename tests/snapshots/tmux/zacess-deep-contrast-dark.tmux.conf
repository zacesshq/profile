# for tmux, from the profile Zacess Deep Contrast Dark
# written by zprf; change the profile and render again rather than editing this file
# load it from tmux.conf with: source-file <path to this file>

set -g status-style "fg=#ffffff,bg=#000000"
set -g window-status-style "fg=#b3b3b3,bg=#000000"
set -g window-status-current-style "fg=#000000,bg=#00ffff,bold"
set -g pane-border-style "fg=#00ffff"
set -g pane-active-border-style "fg=#ffff00"
set -g message-style "fg=#ffffff,bg=#000000"
set -g message-command-style "fg=#ffffff,bg=#000000"
set -g mode-style "fg=#000000,bg=#ff70ff"
set -g display-panes-colour "#00ffff"
set -g display-panes-active-colour "#ffff00"
set -g clock-mode-colour "#00ffff"
set -g visual-bell off
