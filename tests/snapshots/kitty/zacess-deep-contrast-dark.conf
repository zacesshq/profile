# for kitty, from the profile Zacess Deep Contrast Dark
# written by zprf; change the profile and render again rather than editing this file
# load it from kitty.conf with: include <path to this file>

foreground #ffffff
background #000000
selection_foreground #000000
selection_background #ff70ff
cursor #ffff00
cursor_text_color #000000
url_color #1db4ff
active_border_color #ffff00
inactive_border_color #00ffff
active_tab_foreground #000000
active_tab_background #00ffff
inactive_tab_foreground #b3b3b3
inactive_tab_background #0a0a0a
tab_bar_background #000000

color0 #000000
color1 #ff5f5f
color2 #00cd00
color3 #cdcd00
color4 #8888ff
color5 #ff2aff
color6 #00cdcd
color7 #e5e5e5
color8 #b8b8b8
color9 #ff9e9e
color10 #00ff00
color11 #ffff00
color12 #b0b0ff
color13 #ff8fff
color14 #00ffff
color15 #ffffff

cursor_blink_interval 0
cursor_trail 0
visual_bell_duration 0
font_family Atkinson Hyperlegible Mono
font_size 14.0
# the active window's border is kitty's focus ring
window_border_width 2px
