# for tmux, from the profile Every need
# written by zprf; change the profile and render again rather than editing this file
# load it from tmux.conf with: source-file <path to this file>

set -g status-style "fg=#ffffff,bg=#171b1f"
set -g window-status-style "fg=#a7a7a7,bg=#171b1f"
set -g window-status-current-style "fg=#101418,bg=#66a9ff,bold"
set -g pane-border-style "fg=#696969"
set -g pane-active-border-style "fg=#66a9ff"
set -g message-style "fg=#ffffff,bg=#171b1f"
set -g message-command-style "fg=#ffffff,bg=#171b1f"
set -g mode-style "fg=#101418,bg=#b68cfa"
set -g display-panes-colour "#696969"
set -g display-panes-active-colour "#66a9ff"
set -g clock-mode-colour "#66a9ff"
set -g visual-bell off
# borders are drawn in character cells, so the widest focus ring tmux can draw is a heavy line
set -g pane-border-lines heavy
