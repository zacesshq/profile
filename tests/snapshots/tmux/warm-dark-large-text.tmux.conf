# for tmux, from the profile Warm dark, large text
# written by zprf; change the profile and render again rather than editing this file
# load it from tmux.conf with: source-file <path to this file>

set -g status-style "fg=#ffffff,bg=#221d19"
set -g window-status-style "fg=#aaaaaa,bg=#221d19"
set -g window-status-current-style "fg=#1b1612,bg=#6badff,bold"
set -g pane-border-style "fg=#6c6c6c"
set -g pane-active-border-style "fg=#6badff"
set -g message-style "fg=#ffffff,bg=#221d19"
set -g message-command-style "fg=#ffffff,bg=#221d19"
set -g mode-style "fg=#1b1612,bg=#b98ffd"
set -g display-panes-colour "#6c6c6c"
set -g display-panes-active-colour "#6badff"
set -g clock-mode-colour "#6badff"
set -g visual-bell off
