# for kitty, from the profile Warm dark, large text
# written by zprf; change the profile and render again rather than editing this file
# load it from kitty.conf with: include <path to this file>

foreground #ffffff
background #1b1612
selection_foreground #1b1612
selection_background #b98ffd
cursor #debb00
cursor_text_color #1b1612
url_color #6badff
active_border_color #6badff
inactive_border_color #6c6c6c
active_tab_foreground #1b1612
active_tab_background #6badff
inactive_tab_foreground #aaaaaa
inactive_tab_background #221d19
tab_bar_background #221d19

color0 #1b1612
color1 #ff7d6c
color2 #57b84e
color3 #b9a400
color4 #71a3ff
color5 #e280e0
color6 #00b6b6
color7 #bbbbbb
color8 #a4a4a4
color9 #ffa294
color10 #6fd066
color11 #d2bb00
color12 #95bbff
color13 #fb97f8
color14 #00cfcf
color15 #ffffff

cursor_shape block
# shell integration turns the cursor into a beam at every prompt unless told not to
shell_integration no-cursor
# a program can still ask for a beam, so it is widened too; kitty measures it in points
cursor_beam_thickness 3.0
cursor_blink_interval 0
cursor_trail 0
visual_bell_duration 0
font_family Atkinson Hyperlegible Mono
font_size 18.0
modify_font cell_height 130%
